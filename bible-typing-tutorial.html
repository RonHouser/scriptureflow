<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bible Typing Tutorial</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0b1424; --panel: #2b2f36; --panel-2: #33383f; --line: rgba(255,255,255,0.10);
    --text: #e8ecf2; --muted: #9aa4b2; --accent: #6fa8ff; --gold: #e9c46a; --ok: #7bd389;
  }
  body {
    background: radial-gradient(ellipse at 60% 40%, #16243d 0%, var(--bg) 70%);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    user-select: none;
  }
  /* ?embed=1 → fills an iframe with a transparent page background */
  body.embed { background: transparent; padding: 0; }
  html:has(body.embed), body.embed { overflow: hidden; height: 100%; }
  body.embed #app { width: 100%; height: 100%; max-height: none; aspect-ratio: auto; border-radius: 0; border: none; }
  /* dark, thin scroll bars (only appear if a very small window truly needs them) */
  * { scrollbar-width: thin; scrollbar-color: #4a5160 transparent; }
  ::-webkit-scrollbar { width: 8px; height: 8px; background: transparent; }
  ::-webkit-scrollbar-thumb { background: #4a5160; border-radius: 8px; }
  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }

  #app {
    width: min(1000px, 100%); aspect-ratio: 4 / 3; max-height: calc(100vh - 48px);
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    position: relative; overflow: hidden; display: flex; flex-direction: column;
  }
  .view { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .view[hidden] { display: none; }

  /* ---------- Menu ---------- */
  header { text-align: center; padding: 22px 16px 6px; }
  header h1 { font-family: Georgia, "Cormorant Garamond", serif; font-weight: 500; letter-spacing: .02em;
    font-size: clamp(26px, 4vw, 40px); color: var(--accent); }
  header p { color: var(--muted); font-size: 14px; margin-top: 6px; font-style: italic; }
  #banner { width: 100%; height: 90px; display: block; }
  main { flex: 1; display: grid; grid-template-columns: 220px 1fr; min-height: 0; border-top: 1px solid var(--line); }
  nav { border-right: 1px solid var(--line); overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
  .lesson-btn { text-align: left; font: inherit; color: var(--text); background: transparent;
    border: 1px solid transparent; border-radius: 10px; padding: 10px 12px; cursor: pointer;
    display: flex; flex-direction: column; gap: 2px; }
  .lesson-btn small { color: var(--muted); font-size: 12px; }
  .lesson-btn:hover { background: var(--panel-2); }
  .lesson-btn[aria-selected="true"] { background: var(--panel-2); border-color: var(--accent); }
  .lesson-btn.locked { opacity: .45; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #detail { padding: 18px 22px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
  #detail h2 { font-size: 22px; }
  #detail .story { color: var(--muted); font-size: 14px; font-style: italic; }
  .keys { display: flex; gap: 6px; flex-wrap: wrap; }
  .key { min-width: 34px; height: 34px; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center;
    border-radius: 6px; background: #1f2329; border: 1px solid var(--line); font-weight: 700; }
  .modules { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .module { font: inherit; color: var(--text); text-align: left; background: #24282e; border: 1px solid var(--line);
    border-radius: 12px; padding: 14px; cursor: pointer; display: flex; flex-direction: column; gap: 6px;
    transition: transform .15s ease, border-color .15s ease; }
  .module:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--accent); }
  .module:disabled { cursor: not-allowed; opacity: .5; }
  .module .tag { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  .module h3 { font-size: 16px; }
  .module p { font-size: 13px; color: var(--muted); line-height: 1.4; }
  .module .status { margin-top: auto; font-size: 12px; color: var(--gold); }
  .module .status.done { color: var(--ok); }
  footer { border-top: 1px solid var(--line); padding: 10px 16px; display: flex; gap: 10px; justify-content: center; }
  .pill { font: inherit; font-size: 13px; color: var(--text); background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 999px; padding: 7px 16px; cursor: pointer; }
  .pill:hover { border-color: var(--accent); }
  #toast { position: absolute; left: 50%; bottom: 60px; transform: translateX(-50%); background: #111; color: var(--text);
    padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 60; }
  #toast.show { opacity: 1; }

  /* ---------- Game ---------- */
  .topbar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  #game-title { flex: 1; text-align: center; font-size: 14px; color: var(--muted); }
  #game-title b { color: var(--text); }
  .stage { flex: 1; position: relative; min-height: 0; }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #overlay { position: absolute; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; text-align: center; padding: 24px; background: rgba(20, 23, 28, 0.82);
    opacity: 0; pointer-events: none; transition: opacity .5s ease; }
  #overlay.show { opacity: 1; pointer-events: auto; }
  #ov-title { font-size: clamp(40px, 8vw, 84px); line-height: 1; color: #fff; }
  #ov-verse { font-size: clamp(15px, 2vw, 20px); font-style: italic; color: var(--text); max-width: 680px; }
  #ov-stats { font-size: 15px; color: var(--muted); line-height: 1.6; }
  #ov-stats .hi { color: var(--gold); font-weight: 700; }
  .ov-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
  .ov-btns button { font: inherit; font-size: 17px; font-weight: 700; border-radius: 999px; padding: 11px 28px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--text); }
  .ov-btns button.primary { background: var(--accent); color: #0b1424; border-color: var(--accent); }
  .ov-btns button[hidden] { display: none; }
  #overlay .small { font-size: 12px; color: var(--muted); }

  /* Shorter windows (e.g. inside the main site): tighten the menu so everything fits without scrolling */
  @media (max-height: 760px) {
    header { padding: 12px 16px 2px; }
    header h1 { font-size: clamp(24px, 3.4vw, 32px); }
    header p { font-size: 13px; margin-top: 2px; }
    #banner { height: 64px; }
    nav { padding: 8px; gap: 4px; }
    .lesson-btn { padding: 5px 9px; font-size: 14px; gap: 0; }
    .lesson-btn span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lesson-btn small { font-size: 11px; }
    nav { gap: 2px; }
    #detail { padding: 12px 18px; gap: 10px; }
    #detail h2 { font-size: 20px; }
    .key { min-width: 30px; height: 30px; }
    .module { padding: 10px 12px; gap: 4px; }
    .module p { font-size: 12px; line-height: 1.35; }
    footer { padding: 7px 16px; }
    .pill { padding: 6px 14px; }
  }
  @media (max-height: 560px) {
    header { padding: 8px 16px 0; }
    header p { font-size: 12px; }
    #banner { height: 50px; }
    .lesson-btn { padding: 4px 9px; }
    .lesson-btn span { white-space: normal; line-height: 1.2; }
  }
  @media (max-height: 470px) {
    #banner { display: none; }
    header p { display: none; }
    .lesson-btn { flex-direction: row; align-items: baseline; justify-content: space-between; gap: 6px; }
    .lesson-btn span { white-space: nowrap; }
    .lesson-btn small { flex-shrink: 0; }
    .module p { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  }
  /* Medium widths: keep the side list, just narrower */
  @media (max-width: 900px) {
    main { grid-template-columns: 170px 1fr; }
    .lesson-btn { font-size: 14px; }
  }
  @media (max-width: 560px) {
    #app { aspect-ratio: auto; height: calc(100vh - 48px); }
    main { grid-template-columns: 1fr; }
    nav { flex-direction: row; overflow-x: auto; border-right: none; border-bottom: 1px solid var(--line); }
    .lesson-btn { min-width: 150px; }
    .modules { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="app">
  <section class="view" id="menu-view">
    <header>
      <h1>Bible Typing Tutorial</h1>
      <p>“Whatsoever thy hand findeth to do, do it with thy might.” — Ecclesiastes 9:10</p>
    </header>
    <canvas id="banner" aria-hidden="true"></canvas>
    <main>
      <nav id="lessons" role="tablist" aria-label="Lessons"></nav>
      <section id="detail" aria-live="polite"></section>
    </main>
    <footer>
      <button type="button" class="pill" id="btn-progress">Progress</button>
      <button type="button" class="pill" id="btn-sound-menu">Sound: On</button>
      <button type="button" class="pill" id="btn-reset">Reset Progress</button>
    </footer>
  </section>

  <section class="view" id="game-view" hidden>
    <div class="topbar">
      <button type="button" class="pill" id="btn-back">← Menu</button>
      <div id="game-title"></div>
      <button type="button" class="pill" id="btn-sound">Sound: On</button>
    </div>
    <div class="stage">
      <canvas id="stage"></canvas>
      <div id="overlay" role="dialog" aria-live="polite">
        <h1 id="ov-title"></h1>
        <p id="ov-verse"></p>
        <p id="ov-stats"></p>
        <div class="ov-btns">
          <button type="button" id="ov-next">Next Module ▶</button>
          <button type="button" id="ov-retry">Try Again</button>
          <button type="button" id="ov-menu">Menu</button>
        </div>
        <p class="small">Enter = continue · Esc = menu</p>
      </div>
    </div>
  </section>
  <div id="toast" role="status"></div>
</div>
<script>
(() => {
'use strict';
/* =====================================================================
   CORE — helpers, sound, hands, typing engine
   ===================================================================== */
const TAU = Math.PI * 2;
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const lerp2 = (p, q, t) => [lerp(p[0], q[0], t), lerp(p[1], q[1], t)];
const easeOut = t => 1 - (1 - t) * (1 - t);
const easeOut3 = t => 1 - Math.pow(1 - t, 3);
const easeIn = t => t * t;
const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const rand = (a, b) => a + Math.random() * (b - a);
const pickOne = arr => arr[Math.floor(Math.random() * arr.length)];

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');

function pen(lw, a = 1, rgb = '255,255,255') {
  ctx.strokeStyle = `rgba(${rgb},${a})`; ctx.fillStyle = `rgba(${rgb},${a})`;
  ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
}
function poly(pts) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.stroke();
}
function circle(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, TAU); fill ? ctx.fill() : ctx.stroke(); }
function star(x, y, s) {
  ctx.beginPath();
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rr = i % 2 ? s * 0.4 : s; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  ctx.closePath(); ctx.fill();
}
function rrect(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function text(str, x, y, size, alpha = 1, weight = 700, color = '255,255,255') {
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = `rgba(${color},${alpha})`; ctx.fillText(str, x, y);
}
// Two-bone IK → [joint, end]
function ik(base, target, L1, L2, bend) {
  let dx = target[0] - base[0], dy = target[1] - base[1];
  let d = Math.hypot(dx, dy) || 0.0001, end = target;
  if (d > L1 + L2 - 0.01) { const k = (L1 + L2 - 0.01) / d; end = [base[0] + dx * k, base[1] + dy * k]; d = L1 + L2 - 0.01; }
  const a = Math.atan2(dy, dx);
  const c = clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1);
  const ang = a - bend * Math.acos(c);
  return [[base[0] + Math.cos(ang) * L1, base[1] + Math.sin(ang) * L1], end];
}
function hills(off = 0) {
  const w = E.sw, g = E.g, h = E.sh;
  pen(2, 0.09); ctx.beginPath();
  for (let i = 0; i <= 60; i++) {
    const x = w * i / 60, u = (x + off) / w;
    const y = g - h * (0.22 + 0.08 * Math.sin(u * 5.5 + 0.5) + 0.05 * Math.sin(u * 14 + 2));
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.stroke();
}

/* ---------- particles & floating text ---------- */
function burst(list, x, y, n, kind, speed, size) {
  for (let i = 0; i < n; i++) {
    const a = kind === 'dust' ? Math.PI + Math.random() * Math.PI : kind === 'steam' ? -Math.PI / 2 + rand(-0.5, 0.5) : Math.random() * TAU;
    const sp = speed * rand(0.4, 1.2);
    list.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0, max: rand(0.45, 0.9), kind, size: size * rand(0.7, 1.3) });
  }
}
function stepParticles(list, dt) {
  const grav = E.sh * 1.2;
  for (let i = list.length - 1; i >= 0; i--) {
    const p = list[i]; p.life += dt;
    if (p.life >= p.max) { list.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.kind === 'spark' || p.kind === 'drop') p.vy += grav * dt;
    else if (p.kind === 'brick') { p.vy += grav * 1.4 * dt; p.rot += p.vr * dt; if (p.y > E.g - p.size * 0.5) { p.y = E.g - p.size * 0.5; p.vy *= -0.2; p.vx *= 0.6; p.vr *= 0.5; } }
    else if (p.kind === 'dust') p.vy += grav * 0.3 * dt;
    p.vx *= 0.96;
  }
}
function drawParticles(list) {
  for (const p of list) {
    const k = 1 - p.life / p.max;
    if (p.kind === 'spark') { pen(1, k); star(p.x, p.y, p.size * k); }
    else if (p.kind === 'drop') { pen(1, 0.75 * k, '160,200,255'); circle(p.x, p.y, p.size, true); }
    else if (p.kind === 'brick') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.globalAlpha = Math.min(1, k * 3); ctx.fillStyle = '#2b2f36'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.fillRect(-p.size, -p.size * 0.5, p.size * 2, p.size); ctx.strokeRect(-p.size, -p.size * 0.5, p.size * 2, p.size); ctx.restore(); }
    else { pen(1, (p.kind === 'steam' ? 0.35 : 0.45) * k); circle(p.x, p.y, p.size * (1.6 - k * 0.6), true); }
  }
}
function floatText(list, x, y, str, size, o = {}) {
  list.push({ x, y, str, size, vx: o.vx ?? rand(-12, 12), vy: o.vy ?? -E.sh * 0.18, life: 0, max: o.max ?? 1.5 });
}
function stepFloats(list, dt) {
  for (let i = list.length - 1; i >= 0; i--) {
    const f = list[i]; f.life += dt;
    if (f.life >= f.max) { list.splice(i, 1); continue; }
    f.x += f.vx * dt; f.y += f.vy * dt;
  }
}
function drawFloats(list) {
  for (const f of list) { const k = 1 - f.life / f.max; text(f.str, f.x, f.y, f.size, Math.min(1, k * 1.6)); }
}

/* ---------- profile-scoped storage ----------
   Uses the same profile that is selected on the main Scripture Flow page (same site = same localStorage),
   so each child keeps their own tutorial progress and sound setting. */
const PROFILE = (() => {
  try {
    const list = JSON.parse(localStorage.getItem('scripture-flow-profiles')) || [];
    const cur = localStorage.getItem('scripture-flow-current-profile') || '';
    return list.includes(cur) ? cur : (list[0] || '');
  } catch { return ''; }
})();
const pkey = base => PROFILE ? `${base}-${PROFILE}` : base;
// One-time move: progress saved before profiles were supported goes to the first profile that opens the tutorial.
try {
  if (PROFILE && localStorage.getItem('btt-progress-v2') !== null && localStorage.getItem(pkey('btt-progress-v2')) === null) {
    localStorage.setItem(pkey('btt-progress-v2'), localStorage.getItem('btt-progress-v2'));
    localStorage.removeItem('btt-progress-v2');
  }
} catch {}
/* ---------- sound (Web Audio, no files needed) ---------- */
const Sound = {
  ac: null, master: null,
  on: (() => { try { return localStorage.getItem(pkey('btt-sound')) !== 'off'; } catch { return true; } })(),
  set(on) { this.on = on; try { localStorage.setItem(pkey('btt-sound'), on ? 'on' : 'off'); } catch {} },
  ensure() {
    if (!this.on) return null;
    if (!this.ac) {
      try {
        this.ac = new (window.AudioContext || window.webkitAudioContext)();
        this.master = this.ac.createGain(); this.master.gain.value = 0.45; this.master.connect(this.ac.destination);
      } catch { return null; }
    }
    if (this.ac.state === 'suspended') this.ac.resume();
    return this.ac;
  },
  pluck(freq, vol = 0.22, dur = 1.6) {
    const ac = this.ensure(); if (!ac) return;
    const t = ac.currentTime;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    const f = ac.createBiquadFilter(); f.type = 'lowpass';
    f.frequency.setValueAtTime(freq * 7, t); f.frequency.exponentialRampToValueAtTime(freq * 1.6, t + dur * 0.6);
    f.connect(g); g.connect(this.master);
    [[1, 'triangle', 1], [2, 'sine', 0.35], [3, 'sine', 0.12]].forEach(([m, type, a]) => {
      const o = ac.createOscillator(); o.type = type; o.frequency.value = freq * m;
      const og = ac.createGain(); og.gain.value = a; o.connect(og); og.connect(f);
      o.start(t); o.stop(t + dur + 0.05);
    });
  },
  noise(dur, vol, fromF, toF, type = 'lowpass') {
    const ac = this.ensure(); if (!ac) return;
    const t = ac.currentTime, n = Math.floor(ac.sampleRate * dur);
    const buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource(); src.buffer = buf;
    const f = ac.createBiquadFilter(); f.type = type;
    f.frequency.setValueAtTime(fromF, t); f.frequency.exponentialRampToValueAtTime(toF, t + dur);
    const g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.master); src.start(t);
  },
  whoosh() { this.noise(0.35, 0.25, 500, 3000, 'bandpass'); },
  thud() { this.noise(0.22, 0.5, 900, 90); },
  boom() { this.noise(0.7, 0.8, 380, 35); },
  twang() { this.pluck(116, 0.12, 0.5); this.pluck(123, 0.12, 0.5); }
};
// D-major pentatonic, one note per keyboard column
const NOTES = [293.66, 329.63, 369.99, 440, 493.88, 587.33, 659.25, 739.99, 880, 987.77];
const COL = { q: 0, w: 1, e: 2, r: 3, t: 4, y: 5, u: 6, i: 7, o: 8, p: 9, a: 0, s: 1, d: 2, f: 3, g: 4, h: 5, j: 6, k: 7, l: 8, ';': 9 };
const noteFor = ch => NOTES[COL[ch] ?? 0] * ('asdfghjkl;'.includes(ch) ? 0.5 : 1);

/* ---------- finger map ---------- */
// 0 L-pinky, 1 L-ring, 2 L-middle, 3 L-index, 4 R-index, 5 R-middle, 6 R-ring, 7 R-pinky, 8 thumbs
const FINGER = {};
[['qaz1', 0], ['wsx2', 1], ['edc3', 2], ['rfvtgb45', 3], ['yhnujm67', 4], ['ik,8', 5], ['ol.9', 6], ['p;/0', 7]]
  .forEach(([s, f]) => { for (const c of s) FINGER[c] = f; });
FINGER[' '] = 8; FINGER["'"] = 7;
// shifted characters → the base key that produces them
const SHIFTED = { '!': '1', '@': '2', '#': '3', '$': '4', '%': '5', '?': '/', ':': ';', '"': "'" };
const needsShift = ch => /[A-Z]/.test(ch) || ch in SHIFTED;
// which fingers to light up: main finger + opposite pinky for Shift
function fingersFor(ch) {
  if (ch == null) return { main: -1, shift: -1 };
  const base = SHIFTED[ch] || ch.toLowerCase();
  const main = FINGER[base] ?? -1;
  return { main, shift: needsShift(ch) ? (main < 4 ? 7 : 0) : -1 };
}
const glyph = ch => ch === ' ' ? '␣' : ch;
const HOME_KEYS = ['a', 's', 'd', 'f', 'j', 'k', 'l', ';'];
const TOP_ROW = ['q', 'w', 'e', 'r', 't', 'y', 'u', 'i', 'o', 'p'];

function drawHands(act, ch, top, h, W, press, miss, alpha) {
  const active = act.main;
  ctx.save(); ctx.globalAlpha = alpha;
  const hw = Math.min(W * 0.2, h * 1.1);
  const fw = hw * 0.185, gap = hw * 0.05, L = h * 0.46, palmH = h * 0.34;
  const lens = [0.62, 0.8, 0.88, 0.76];               // pinky → index
  const palmTop = top + h * 0.06 + L * 0.88;
  const span = 4 * fw + 3 * gap;
  [W * 0.5 - hw * 0.8, W * 0.5 + hw * 0.8].forEach((cx, side) => {
    const x0 = cx - span / 2;
    const fill = on => {
      if (on) {
        ctx.fillStyle = miss > 0 ? `rgba(${Math.round(lerp(111, 255, miss))},${Math.round(lerp(168, 120, miss))},${Math.round(lerp(255, 120, miss))},0.95)` : 'rgba(111,168,255,0.95)';
        ctx.strokeStyle = '#d6e6ff'; ctx.lineWidth = 2.5;
      } else { ctx.fillStyle = '#30353c'; ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 1.6; }
      ctx.fill(); ctx.stroke();
    };
    // thumb
    ctx.save();
    ctx.translate(side === 0 ? cx + span / 2 - fw * 0.1 : cx - span / 2 + fw * 0.1, palmTop + palmH * 0.5);
    ctx.rotate(side === 0 ? 0.95 : -0.95);
    rrect(-fw / 2, -L * 0.62 + (active === 8 ? press * L * 0.06 : 0), fw, L * 0.7, fw / 2); fill(active === 8);
    if (active === 8) text('␣', 0, -L * 0.42, fw * 0.6, 1, 700, '11,20,36');
    ctx.restore();
    // fingers
    for (let j = 0; j < 4; j++) {
      const fi = side === 0 ? j : 4 + j;
      const len = L * lens[side === 0 ? j : 3 - j];
      const on = fi === active, sh = fi === act.shift;
      const fx = x0 + j * (fw + gap);
      const fy = palmTop - len + (on ? press * L * 0.08 : 0);
      if (on) { ctx.save(); ctx.shadowColor = 'rgba(111,168,255,0.8)'; ctx.shadowBlur = 16; rrect(fx, fy, fw, len + fw, fw / 2); fill(true); ctx.restore(); }
      else if (sh) { rrect(fx, fy, fw, len + fw, fw / 2); ctx.fillStyle = 'rgba(233,196,106,0.9)'; ctx.strokeStyle = '#f5e2b0'; ctx.lineWidth = 2.5; ctx.fill(); ctx.stroke(); }
      else { rrect(fx, fy, fw, len + fw, fw / 2); fill(false); }
      if (sh) text('⇧', fx + fw / 2, fy + fw * 0.62, fw * 0.6, 1, 700, '11,20,36');
      else text(on ? (SHIFTED[ch] || ch.toLowerCase()) : HOME_KEYS[fi], fx + fw / 2, fy + fw * 0.62, fw * (on ? 0.7 : 0.55), on ? 1 : 0.4, 700, on ? '11,20,36' : '255,255,255');
    }
    // palm (covers finger bases)
    rrect(x0 - fw * 0.15, palmTop - fw * 0.15, span + fw * 0.3, palmH, fw * 0.9);
    ctx.fillStyle = '#30353c'; ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 1.6; ctx.fill(); ctx.stroke();
    text(side === 0 ? 'LEFT' : 'RIGHT', cx, palmTop + palmH * 0.45, fw * 0.42, 0.3, 600);
  });
  ctx.restore();
}

/* ---------- progress ---------- */
const Progress = {
  data: (() => { try { return JSON.parse(localStorage.getItem(pkey('btt-progress-v2'))) || {}; } catch { return {}; } })(),
  get(id) { return this.data[id] || {}; },
  save() { try { localStorage.setItem(pkey('btt-progress-v2'), JSON.stringify(this.data)); } catch {} },
  record(id, res) {
    const p = this.data[id] || {};
    let isBest = false;
    if (res.win) p.done = true;
    if (res.score != null && (p.best == null || res.score > p.best)) { isBest = p.best != null || !!res.win; p.best = res.score; p.bestLabel = res.bestLabel; }
    this.data[id] = p; this.save();
    return isBest;
  },
  reset() { this.data = {}; this.save(); }
};

/* ---------- typing engine ---------- */
const APPROACH = 0.52, EXIT_NORMAL = 0.28, EXIT_FAST = 0.14;
const STACK_OPACITY = [1.0, 0.80, 0.62, 0.45, 0.30];

const E = {
  W: 0, H: 0, dpr: 1, sw: 0, sh: 0, g: 0, F: 0, trackY: 0, handTop: 0, handH: 0,
  mod: null, S: null, state: 'idle', clock: 0, elapsed: 0,
  queue: [], cur: null, approach: 0, exiting: [],
  typed: 0, misses: 0, press: 0, missT: 0, trackAlpha: 1, shake: 0, lastRes: null,

  resize() {
    const r = canvas.getBoundingClientRect();
    if (!r.width || !r.height) return;
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.W = r.width; this.H = r.height;
    canvas.width = Math.round(this.W * this.dpr); canvas.height = Math.round(this.H * this.dpr);
    this.sh = this.H * 0.55; this.sw = this.W; this.g = this.sh * 0.94;
    this.F = Math.min(this.H * 0.12, this.W * 0.1);
    this.trackY = this.H * 0.655; this.handTop = this.H * 0.75; this.handH = this.H * 0.25;
  },

  start(mod) {
    this.mod = mod; this.S = { particles: [], floats: [] };
    this.state = 'ready'; this.elapsed = 0; this.typed = 0; this.misses = 0;
    this.queue = []; this.exiting = []; this.trackAlpha = 1; this.shake = 0; this.press = 0; this.missT = 0;
    UI.showGame(mod); this.resize();
    mod.init(this.S);
    this.fill(); this.cur = this.queue.shift(); this.fill(); this.approach = 0;
  },
  pick() {
    const m = this.mod;
    let c = m.pick ? m.pick(this.S, this.queue) : pickOne(m.keys);
    const q = this.queue, n = q.length;
    if (!m.pick && n >= 2 && q[n - 1] === c && q[n - 2] === c) c = pickOne(m.keys);   // avoid triples
    return c;
  },
  fill() { while (this.queue.length < 6) this.queue.push(this.pick()); },

  key(e) {
    if (UI.view !== 'game') return;
    if (UI.overlayOpen) {
      if (e.key === 'Enter') { e.preventDefault(); UI.primary(); }
      else if (e.key === 'Escape') { e.preventDefault(); UI.showMenu(); }
      return;
    }
    if (e.key === 'Escape') { e.preventDefault(); UI.showMenu(); return; }
    if (this.state !== 'ready' && this.state !== 'playing') return;
    if (e.ctrlKey || e.altKey || e.metaKey || e.key.length > 1) return;
    e.preventDefault();
    const expected = this.cur, k = this.mod.caseSensitive ? e.key : e.key.toLowerCase();
    if (k === expected) {
      if (this.state === 'ready') this.state = 'playing';
      this.typed++; this.press = 1;
      this.exiting.push({ ch: expected, p: easeOut3(clamp(this.approach / APPROACH)), t: 0, dur: this.approach < APPROACH ? EXIT_FAST : EXIT_NORMAL });
      this.cur = this.queue.shift(); this.fill(); this.approach = 0;
      this.mod.onKey(this.S, true, k, expected);
    } else {
      this.missT = 1;
      if (this.state === 'playing') { this.misses++; this.mod.onKey(this.S, false, k, expected); }
    }
  },
  end() { if (this.state === 'ready' || this.state === 'playing') this.state = 'ending'; },
  finish(res) {
    if (this.state === 'done') return;
    this.state = 'done'; this.lastRes = res;
    res.newBest = Progress.record(this.mod.id, res);
    UI.showOverlay(res);
  },
  accuracy() { const t = this.typed + this.misses; return t ? this.typed / t : 1; },
  wpm() { return this.elapsed > 1 ? Math.round((this.typed / 5) / (this.elapsed / 60)) : 0; },

  update(dt) {
    this.clock += dt;
    const m = this.mod; if (!m) return;
    if (this.state === 'playing') {
      this.elapsed += dt;
      if (this.elapsed >= m.duration) { this.state = 'ending'; m.onTimeUp(this.S); }
    }
    m.update(this.S, dt);
    stepParticles(this.S.particles, dt); stepFloats(this.S.floats, dt);
    this.approach += dt;
    for (let i = this.exiting.length - 1; i >= 0; i--) { const x = this.exiting[i]; x.t += dt; if (x.t >= x.dur) this.exiting.splice(i, 1); }
    this.press = Math.max(0, this.press - dt * 6);
    this.missT = Math.max(0, this.missT - dt * 3);
    this.shake = Math.max(0, this.shake - dt * 40);
    const ending = this.state === 'ending' || this.state === 'done';
    this.trackAlpha = ending ? Math.max(0, this.trackAlpha - dt * 2.5) : 1;
  },

  render() {
    const { W, H } = this;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    if (!this.mod || !W) return;
    // scene
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, W, this.sh); ctx.clip();
    if (this.shake > 0) ctx.translate(rand(-0.5, 0.5) * this.shake, rand(-0.5, 0.5) * this.shake);
    this.mod.render(this.S);
    ctx.restore();
    pen(2.5, 0.6); poly([[0, this.g + 1], [W, this.g + 1]]);
    if (this.state === 'ready') text(this.mod.hint || 'Type the letter to begin', W / 2, this.sh * 0.08, Math.max(13, this.H * 0.026), 0.75, 600);
    this.drawTrack();
    if (this.S.line) this.drawLine(this.S.line);
    const ending = this.state === 'ending' || this.state === 'done';
    drawHands(ending ? { main: -1, shift: -1 } : fingersFor(this.cur), this.cur, this.handTop, this.handH, W, this.press, this.missT, ending ? 0.35 : 1);
  },

  // passage line: typed part dim, current char boxed, rest bright
  drawLine(L) {
    if (this.trackAlpha <= 0.01 || !L.text) return;
    const size = Math.max(12, Math.min(this.H * 0.03, this.W * 0.028)), y = this.H * 0.578;
    ctx.save(); ctx.globalAlpha = this.trackAlpha;
    ctx.font = `600 ${size}px ${FONT}`; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    const maxW = this.W * 0.9;
    let a = 0, b = L.text.length;
    while (ctx.measureText(L.text.slice(a, b)).width > maxW) { if (L.pos - a > b - L.pos) a++; else b--; }
    const s = L.text.slice(a, b), x0 = (this.W - ctx.measureText(s).width) / 2, p = L.pos - a;
    const w1 = ctx.measureText(s.slice(0, p)).width, wc = ctx.measureText(s[p] || ' ').width;
    ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillText(s.slice(0, p), x0, y);
    ctx.fillStyle = 'rgba(111,168,255,0.35)'; rrect(x0 + w1 - 2, y - size * 0.7, wc + 4, size * 1.4, 4); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.fillText(s.slice(p), x0 + w1, y);
    if (L.ref) { ctx.textAlign = 'center'; ctx.font = `italic 500 ${size * 0.7}px ${FONT}`; ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.fillText(L.ref, this.W / 2, y - size * 1.25); }
    ctx.restore();
  },
  drawTrack() {
    if (this.trackAlpha <= 0.01) return;
    const { W, F } = this, cy = this.trackY, cx = W / 2, sF = F * 0.37;
    const sx0 = W * 0.68, step = sF * 1.35;
    ctx.save(); ctx.globalAlpha = this.trackAlpha;
    for (let i = 0; i < 5; i++) if (this.queue[i]) text(glyph(this.queue[i]), sx0 + step * (i + 1), cy, sF, STACK_OPACITY[i]);
    for (const x of this.exiting) {
      const p = easeIn(clamp(x.t / x.dur));
      const s = lerp(lerp(0.37, 1, x.p), 0.82, p);
      text(glyph(x.ch), lerp(sx0, cx, x.p) - W * 0.28 * p, cy, F * s, 1 - p);
    }
    if (this.cur) {
      const p = easeOut3(clamp(this.approach / APPROACH));
      const shakeX = this.missT * Math.sin(this.clock * 80) * F * 0.06;
      const col = this.missT > 0 ? `255,${Math.round(lerp(255, 130, this.missT))},${Math.round(lerp(255, 130, this.missT))}` : '255,255,255';
      text(glyph(this.cur), lerp(sx0, cx, p) + shakeX, cy, F * lerp(0.37, 1, p), 1, 700, col);
    }
    ctx.restore();
  }
};

let lastFrame = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastFrame) / 1000); lastFrame = now;
  if (UI.view === 'game') { E.update(dt); E.render(); }
  else if (UI.view === 'menu') Banner.draw(now);
  requestAnimationFrame(frame);
}
new ResizeObserver(() => E.resize()).observe(canvas);
document.addEventListener('keydown', e => E.key(e));


/* =====================================================================
   LESSON 1 — HOME ROW (David and Goliath)
   ===================================================================== */
const SWING = TAU / 0.26;   // one sling revolution ≈ 0.26 s
function newSling() {
  return { angle: Math.PI / 2, target: Math.PI / 2, raise: 0, lastSwingAt: -1e9, releases: [], snap: 0, reload: 1, cheer: 0, cheerT: 0, cheerOn: false, squash: 1 };
}
function slingStep(sl, dt) {
  const diff = sl.target - sl.angle;
  if (diff > 1e-6) { const w = Math.max(SWING, diff * 7); sl.angle = Math.min(sl.target, sl.angle + w * dt); sl.lastSwingAt = E.clock; }
  const goal = (diff > 1e-6 || E.clock - sl.lastSwingAt < 0.45) ? 1 : 0;
  sl.raise += (goal - sl.raise) * Math.min(1, dt * 12);
  let fired = 0;
  while (sl.releases.length && sl.angle >= sl.releases[0]) { sl.releases.shift(); fired++; }
  sl.snap = Math.max(0, sl.snap - dt / 0.35); sl.reload += dt;
  if (sl.cheerOn) { sl.cheer = Math.min(1, sl.cheer + dt * 4); sl.cheerT += dt; }
  return fired;
}
// queue a release on the swing just added: pouch forward-and-up
const releaseAngle = target => target - Math.PI / 2 - 0.35;

function slingRig(x, g, h, sl) {
  const lw = Math.max(2.5, h * 0.035);
  const legL = h * 0.46, torso = h * 0.30, r = h * 0.10, armL = h * 0.30;
  const bob = sl.cheer > 0 ? -Math.abs(Math.sin(sl.cheerT * 8)) * h * 0.10 * sl.cheer : 0;
  const hip = [x, g - legL * 0.97 + bob], sh = [x, hip[1] - torso], head = [x, sh[1] - r * 1.35];
  const feet = [[x - h * 0.11, g + bob], [x + h * 0.11, g + bob]];
  const rest = [sh[0] + armL * 0.30, sh[1] + armL * 0.86];
  const up = [sh[0] + armL * 0.12, sh[1] - armL * 0.90];
  const snap = [sh[0] + armL * 0.92, sh[1] - armL * 0.30];
  let handT = lerp2(rest, up, easeInOut(clamp(sl.raise)));
  handT = lerp2(handT, snap, sl.snap);
  handT = lerp2(handT, [sh[0] + armL * 0.45, sh[1] - armL * 0.85], sl.cheer);
  const backT = lerp2([sh[0] - armL * 0.28, sh[1] + armL * 0.88], [sh[0] - armL * 0.45, sh[1] - armL * 0.85], sl.cheer);
  const [elbow, hand] = ik(sh, handT, armL / 2, armL / 2, -1);
  const [elbowB, handB] = ik(sh, backT, armL / 2, armL / 2, -1);
  const sway = sl.raise < 0.05 ? Math.sin(E.clock * 2) * 0.12 : 0;
  const theta = sl.angle + sway, slL = h * 0.22;
  const pouch = [hand[0] + Math.cos(theta) * slL, hand[1] + Math.sin(theta) * slL];
  return { x, lw, legL, r, hip, sh, head, feet, elbow, hand, elbowB, handB, theta, slL, pouch, rockR: Math.max(2.5, h * 0.028) };
}
function drawSlingDavid(R, sl, showRock, trail = 0) {
  ctx.save();
  if (sl.squash < 1) { ctx.translate(R.x, E.g); ctx.scale(1 + (1 - sl.squash) * 1.3, sl.squash); ctx.translate(-R.x, -E.g); }
  pen(R.lw);
  for (const f of R.feet) { const [k, ft] = ik(R.hip, f, R.legL / 2, R.legL / 2, 1); poly([R.hip, k, ft]); }
  poly([R.hip, R.sh]);
  circle(R.head[0], R.head[1], R.r, false);
  circle(R.head[0] + R.r * 0.45, R.head[1] - R.r * 0.1, R.lw * 0.45, true);
  poly([R.sh, R.elbowB, R.handB]); poly([R.sh, R.elbow, R.hand]);
  if (trail > 0.05) {
    pen(R.lw * 0.8, 0.22); ctx.beginPath(); ctx.arc(R.hand[0], R.hand[1], R.slL, R.theta - trail, R.theta); ctx.stroke();
  }
  const px = Math.cos(R.theta + Math.PI / 2) * R.rockR * 1.2, py = Math.sin(R.theta + Math.PI / 2) * R.rockR * 1.2;
  pen(Math.max(1.2, R.lw * 0.35));
  poly([R.hand, [R.pouch[0] + px, R.pouch[1] + py]]); poly([R.hand, [R.pouch[0] - px, R.pouch[1] - py]]);
  pen(Math.max(1.5, R.lw * 0.5)); poly([[R.pouch[0] + px, R.pouch[1] + py], [R.pouch[0] - px, R.pouch[1] - py]]);
  if (showRock) { pen(1); circle(R.pouch[0], R.pouch[1], R.rockR, true); }
  ctx.restore();
}
function newRock(sx, sy, tx, ty, dur, arc, extra = {}) { return Object.assign({ sx, sy, tx, ty, t: 0, dur, arc, x: sx, y: sy, trail: [] }, extra); }
function stepRock(r, dt) {
  r.t += dt; const p = clamp(r.t / r.dur);
  r.x = lerp(r.sx, r.tx, p); r.y = lerp(r.sy, r.ty, p) - r.arc * 4 * p * (1 - p);
  r.trail.push([r.x, r.y]); if (r.trail.length > 6) r.trail.shift();
  return p >= 1;
}
function drawRock(r, rad) {
  r.trail.forEach((p, i) => { pen(1, 0.12 * (i + 1)); circle(p[0], p[1], rad * 0.7, true); });
  pen(1); circle(r.x, r.y, rad, true);
}
const davidX = () => Math.max(E.sw * 0.12, E.sh * 0.24);

/* ---------------------------------------------------------------------
   L1 · M1 — POWER THE SLING (right hand, SPEED → distance)
   --------------------------------------------------------------------- */
const PowerSling = {
  id: 'L1M2', title: 'Power the Sling', keys: ['j', 'k', 'l', ';'], duration: 30, GOAL: 75,
  hint: 'Right fingers on J K L ; · type fast to spin the sling',
  ppc() { return E.sw * 0.8 / 60; },             // pixels per cubit
  init(S) { Object.assign(S, { sl: newSling(), power: 0, energy: 0, phase: 'spin', cam: 0, flight: null, dist: 0, endT: 0, landed: false, relAt: 0 }); },
  onKey(S, ok) {
    if (S.phase !== 'spin') return;
    if (ok) { S.energy++; S.power += 0.25 * (1 - S.power); }
    else S.power *= 0.8;
  },
  onTimeUp(S) {
    const acc = E.accuracy();
    S.dist = Math.max(1, Math.round(S.energy * 3.2 * acc * acc));
    S.phase = 'windup'; S.power = Math.max(S.power, 0.45);
    const a = S.sl.angle, target = -0.35;
    let d = (((target - a) % TAU) + TAU) % TAU; if (d < 0.6) d += TAU;
    S.relAt = a + d;
  },
  update(S, dt) {
    const sl = S.sl, hD = E.sh * 0.4, dX = davidX();
    if (S.phase === 'spin' || S.phase === 'windup') {
      if (E.state === 'playing') S.power -= 0.35 * S.power * dt;
      if (S.power > 0.03) { sl.angle += lerp(4, 28, S.power) * dt; sl.lastSwingAt = E.clock; }
      sl.target = sl.angle;
      if (S.phase === 'windup' && sl.angle >= S.relAt) {
        const R = slingRig(dX, E.g, hD, sl);
        const landX = dX + S.dist * this.ppc();
        S.flight = newRock(R.pouch[0], R.pouch[1], landX, E.g - 3, clamp(1 + S.dist / 50, 1.2, 4), Math.min(E.sh * 0.55, E.sh * 0.25 + S.dist * 2));
        S.phase = 'flight'; sl.snap = 1; sl.reload = 0; S.power = 0; Sound.whoosh();
      }
    }
    slingStep(sl, dt);
    if (S.phase === 'flight') {
      if (stepRock(S.flight, dt)) {
        S.phase = 'landed'; S.endT = 0; E.shake = 6; Sound.thud();
        burst(S.particles, S.flight.x, E.g, 14, 'dust', E.sh * 0.4, E.sh * 0.03);
      }
      S.cam = Math.max(0, S.flight.x - E.sw * 0.45);
    }
    if (S.phase === 'landed') {
      S.endT += dt;
      if (S.dist >= this.GOAL) sl.cheerOn = true;
      if (S.endT > 1.8) {
        const win = S.dist >= this.GOAL;
        E.finish({
          win, title: win ? 'Mighty Throw!' : 'Try Again',
          verse: win ? '“…and took thence a stone, and slang it…” — 1 Samuel 17:49' : '“…they shall run, and not be weary…” — Isaiah 40:31',
          lines: [`Distance: ${S.dist} cubits  ·  Goal: ${this.GOAL} cubits`], score: S.dist, bestLabel: `${S.dist} cubits`
        });
      }
    }
  },
  render(S) {
    const hD = E.sh * 0.4, dX = davidX(), ppc = this.ppc(), g = E.g;
    hills(S.cam * 0.4);
    ctx.save(); ctx.translate(-S.cam, 0);
    // distance markers
    const fs = Math.max(10, E.sh * 0.045);
    for (let c = 10; c <= 400; c += 10) {
      const x = dX + c * ppc; if (x < S.cam - 40 || x > S.cam + E.sw + 40) continue;
      pen(2, 0.35); poly([[x, g], [x, g - E.sh * 0.03]]);
      text(String(c), x, g - E.sh * 0.07, fs, 0.4, 600);
    }
    const flag = (c, label, a) => {
      const x = dX + c * ppc; pen(2.5, a); poly([[x, g], [x, g - E.sh * 0.35]]);
      ctx.beginPath(); ctx.moveTo(x, g - E.sh * 0.35); ctx.lineTo(x + E.sh * 0.12, g - E.sh * 0.31); ctx.lineTo(x, g - E.sh * 0.27); ctx.closePath(); ctx.fill();
      text(label, x, g - E.sh * 0.41, fs, a);
    };
    flag(this.GOAL, 'Goal', 0.85);
    const best = Progress.get(this.id).best;

  pick(S, queue) {

/* ---------------------------------------------------------------------
   L4 · M2 — MARCH AROUND THE CITY (SPEED → laps)

const MarchCity = {

    const col = ['soldier', 'soldier', 'priest', 'priest', 'priest', 'ark', 'priest', 'priest', 'soldier'];

      else if (kind === 'soldier') { const P = person(x + st, g, h, { walk: walk + i, handF: S.phase === 'win' ? [0.3, -0.95] : null }); pen(P.lw * 0.6); poly([[P.hf[0], P.hf[1] + h * 0.2], [P.hf[0] + h * 0.05, P.hf[1] - h * 0.5]]); }
      else { // ark of the covenant carried on poles
        person(x - h * 0.22, g, h, { walk: walk + i, handF: [0.6, -0.1] }); person(x + h * 0.22, g, h, { walk: walk + i + 1, handB: [-0.6, -0.1] });
        const y = g - h * 0.72; ctx.fillStyle = '#2b2f36'; ctx.fillRect(x - h * 0.16, y - h * 0.18, h * 0.32, h * 0.18); pen(2.5); ctx.strokeRect(x - h * 0.16, y - h * 0.18, h * 0.32, h * 0.18);
        poly([[x - h * 0.45, y - h * 0.04], [x + h * 0.45, y - h * 0.04]]); pen(2, 0.8); poly([[x - h * 0.12, y - h * 0.18], [x - h * 0.06, y - h * 0.28]]); poly([[x + h * 0.12, y - h * 0.18], [x + h * 0.06, y - h * 0.28]]);

    pen(3, 0.6); ctx.beginPath(); ctx.arc(E.sw * 0.5 + (Math.min(laps, 6) - 3) * E.sh * 0.06, E.sh * 0.08, E.sh * 0.03, -Math.PI / 2, -Math.PI / 2 + TAU * ((S.shown % this.LAP) / this.LAP)); if (laps < this.LAPS) ctx.stroke();
    drawParticles(S.particles); drawFloats(S.floats);
  }
};

/* ---------------------------------------------------------------------
   L4 · M3 — THE WALLS FALL (SPEED + ACCURACY)
   Speed = how many shouts you get in. Accuracy = how hard each shout hits.
   --------------------------------------------------------------------- */
const WallsFall = {
  id: 'L4M3', title: 'The Walls Fall', duration: 45, caseSensitive: true, NEED: 7,
  hint: 'Type the verse · every clean word is a mighty shout',
  pick(S) { return feedPick(S); },
  init(S) {
    const vs = [...JOSHUA_VERSES].sort(() => Math.random() - 0.5);
    feedInit(S, verseFeed(vs)); Object.assign(S, { dmg: 0, shown: 0, tally: [0, 0, 0, 0, 0], phase: 'play', endT: 0, blow: 0, shake: 0, spare: 0, fallen: false, cheer: 0 });
  },
  wall() { return { x0: E.sw * 0.55, x1: E.sw * 0.98, h: E.sh * 0.55 }; },
  onKey(S, ok) {
    if (S.phase !== 'play') return;
    const it = feedKey(S, ok); if (!it) return;
    const q = Math.min(it.miss, 4), c = credit(q), W = this.wall();
    S.tally[q]++; S.dmg += c; S.blow = 1; S.shake = c;
    Sound.horn(q === 0 ? 262 : 220, q === 0 ? 0.9 : 0.5, q >= 2);
    floatText(S.floats, (W.x0 + W.x1) / 2, E.g - W.h * 1.1, ['Mighty shout!', 'Good', 'Weak', 'Faint', 'Missed'][q], Math.max(14, E.sh * 0.06));
    if (S.dmg >= this.NEED) { S.phase = 'win'; S.endT = 0; S.spare = Math.max(0, Math.round(this.duration - E.elapsed)); E.end(); }
  },
  onTimeUp(S) { S.phase = 'lose'; S.endT = 0; },
  update(S, dt) {
    S.line = S.phase === 'play' ? feedLine(S) : null;
    S.shown += (S.dmg - S.shown) * Math.min(1, dt * 5);
    S.blow = Math.max(0, S.blow - dt * 1.2); S.shake = Math.max(0, S.shake - dt * 2);
    const t = S.tally, tally = `Mighty ${t[0]} · Good ${t[1]} · Weak ${t[2]} · Faint ${t[3]} · Missed ${t[4]}`;
    if (S.phase === 'win') {
      if (!S.fallen && S.endT > 0.5) { const W = this.wall(); S.fallen = true; collapseWall(S, W.x0, W.x1, W.h); }
      if (S.endT > 1) S.cheer = Math.min(1, S.cheer + dt * 3);
      endAfter(S, dt, 3.2, () => ({ win: true, title: 'The Walls Fell!', verse: '“…the wall fell down flat, so that the people went up into the city…” — Joshua 6:20',
        lines: [`<hi>The walls fell with ${S.spare}s to spare</hi>`, tally], score: S.spare, bestLabel: `${S.spare}s to spare` }));
    }
    if (S.phase === 'lose') endAfter(S, dt, 1.8, () => ({ win: false, title: 'Try Again', verse: '“By faith the walls of Jericho fell down…” — Hebrews 11:30',
      lines: [`The walls were ${Math.round(clamp(S.dmg / this.NEED) * 100)}% shaken`, tally, 'Tip: clean words shout the loudest.'] }));
  },
  render(S) {
    hills();
    const W = this.wall();
    if (!S.fallen) jerichoWall(W.x0, W.x1, W.h, clamp(S.shown / this.NEED), S.shake * 3);
    else { pen(2, 0.5); for (let i = 0; i < 8; i++) poly([[W.x0 + (W.x1 - W.x0) * i / 8, E.g], [W.x0 + (W.x1 - W.x0) * (i + 0.6) / 8, E.g - E.sh * 0.03]]); }
    const h = E.sh * 0.38;
    const end = priest(E.sw * 0.3, E.g, h, S.blow);
    priest(E.sw * 0.2, E.g, h * 0.95, S.blow * 0.8);
    const up = S.cheer || (S.blow > 0.5 ? 0.6 : 0);
    [0.06, 0.12, 0.38, 0.45].forEach((fx, i) => person(E.sw * fx, E.g, h * (0.85 + (i % 2) * 0.1), { bob: -Math.abs(Math.sin(E.clock * 8 + i)) * h * 0.08 * S.cheer, handF: up ? [0.3, -0.95] : null, handB: up ? [0.2, -0.95] : null }));
    if (S.blow > 0) arcs(end[0], end[1], E.sw * 0.12, 4, E.clock * 1.2, 1, 0.5 * S.blow);
    drawParticles(S.particles); drawFloats(S.floats);
  }
};

/* =====================================================================
   LESSON 5 — NUMBER ROW (Feeding the 5,000 · John 6)
   ===================================================================== */
const LEFT_DIGITS = ['1', '2', '3', '4', '5'], RIGHT_DIGITS = ['6', '7', '8', '9', '0'], ALL_DIGITS = [...LEFT_DIGITS, ...RIGHT_DIGITS];
function loaf(x, y, s) { ctx.beginPath(); ctx.ellipse(x, y, s, s * 0.55, 0, 0, TAU); ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fill(); pen(1.2, 0.6, '30,34,40'); for (let i = -1; i <= 1; i++) poly([[x + i * s * 0.4 - s * 0.1, y - s * 0.3], [x + i * s * 0.4 + s * 0.1, y + s * 0.3]]); }
function fish(x, y, s, face = 1) {
  ctx.beginPath(); ctx.ellipse(x, y, s, s * 0.42, 0, 0, TAU); ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(x - face * s * 0.9, y); ctx.lineTo(x - face * s * 1.5, y - s * 0.45); ctx.lineTo(x - face * s * 1.5, y + s * 0.45); ctx.closePath(); ctx.fill();
  pen(1, 0.7, '30,34,40'); circle(x + face * s * 0.55, y - s * 0.08, Math.max(1, s * 0.09), true);
}
function basket(x, y, w, h, fill = 0) {
  ctx.beginPath(); ctx.moveTo(x - w / 2, y - h); ctx.lineTo(x - w * 0.38, y); ctx.lineTo(x + w * 0.38, y); ctx.lineTo(x + w / 2, y - h); ctx.closePath();
  ctx.fillStyle = '#2b2f36'; ctx.fill();
  if (fill > 0) { ctx.save(); ctx.clip(); ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillRect(x - w / 2, y - h * fill, w, h * fill); ctx.restore(); }
  pen(Math.max(1.5, w * 0.05)); ctx.beginPath(); ctx.moveTo(x - w / 2, y - h); ctx.lineTo(x - w * 0.38, y); ctx.lineTo(x + w * 0.38, y); ctx.lineTo(x + w / 2, y - h); ctx.stroke();
  pen(1, 0.35); for (let i = 1; i < 3; i++) poly([[x - w * (0.5 - i * 0.04), y - h * (1 - i / 3)], [x + w * (0.5 - i * 0.04), y - h * (1 - i / 3)]]);
}
// seated crowd: n people in rows; state(i) → { stand, fed }
function crowd(n, x0, x1, yTop, rows, h, state) {
  const per = Math.ceil(n / rows);
  for (let r = rows - 1; r >= 0; r--) for (let c = 0; c < per; c++) {
    const i = r * per + c; if (i >= n) continue;
    const x = lerp(x0, x1, (c + 0.5 + (r % 2) * 0.4) / (per + 0.4)), g = yTop + (E.g - yTop) * (r + 1) / rows;
    const s = state(i), hh = h * (0.75 + r * 0.12);
    ctx.save(); ctx.globalAlpha = 0.55 + r * 0.15;
    if (s.stand) { const P = person(x, g, hh, { face: -1, handF: [0.2, -0.95 - Math.sin(E.clock * 9 + i) * 0.1], handB: [0.3, -0.8] }); text('!', P.head[0], P.head[1] - P.r * 2.4, hh * 0.18, 0.9); }
    else { const P = person(x, g, hh, { face: -1, sit: true, handF: s.fed ? [0.45, -0.3] : null }); if (s.fed) loaf(P.hf[0], P.hf[1] - hh * 0.03, hh * 0.06); }
    ctx.restore();
  }
}

/* ---------------------------------------------------------------------
   L5 · M1 — COUNT THE LOAVES (left hand, ACCURACY → exact counts)
   --------------------------------------------------------------------- */
const CountLoaves = {
  id: 'L5M1', title: 'Count the Loaves', duration: 120, ITEMS: 10, NEED: 8,

  onKey(S, ok) {
    if (S.phase !== 'play') return;
    const it = feedKey(S, ok); if (!it) return;
    S.tries++;
    const B = this.basket();
    if (!it.miss) { S.pile.push({ k: S.pile.length % 7 < 5 ? 'loaf' : 'fish', t: 0 }); Sound.blip(NOTES[S.pile.length % 10]); floatText(S.floats, B.x, B.y - B.h * 2.2, `${it.t} ✓`, Math.max(14, E.sh * 0.06)); }
    else { Sound.twang(); burst(S.particles, B.x, B.y - B.h, 8, 'dust', E.sh * 0.3, E.sh * 0.015); floatText(S.floats, B.x, B.y - B.h * 2.2, 'Miscounted', Math.max(14, E.sh * 0.06)); }
    if (S.tries >= this.ITEMS) { S.phase = 'end'; S.endT = 0; E.end(); }
  },
  onTimeUp(S) { S.phase = 'end'; S.endT = 0; },
  basket() { return { x: E.sw * 0.5, y: E.g - E.sh * 0.02, w: E.sh * 0.42, h: E.sh * 0.18 }; },
  update(S, dt) {
    S.line = S.phase === 'play' ? feedLine(S) : null;
    S.pile.forEach(p => p.t += dt);
    if (S.phase === 'end') {
      const p = S.pile.length, win = p >= this.NEED;
      endAfter(S, dt, 1.8, () => ({ win, title: win ? 'Counted Right!' : 'Try Again',
        verse: win ? '“There is a lad here, which hath five barley loaves, and two small fishes…” — John 6:9' : '“…what are they among so many?” — John 6:9',

      const x = B.x + (col - 1.5) * B.w * 0.2 + (row % 2) * B.w * 0.08, y = B.y - B.h * 0.6 - row * B.h * 0.38 - (1 - drop) * E.sh * 0.2;
      p.k === 'loaf' ? loaf(x, y, B.w * 0.1) : fish(x, y, B.w * 0.09, i % 2 ? 1 : -1);
    });

    drawParticles(S.particles); drawFloats(S.floats);
    text(`Count ${Math.min(S.tries + 1, this.ITEMS)} of ${this.ITEMS}`, E.sw * 0.78, E.sh * 0.1, Math.max(12, E.sh * 0.045), 0.55, 600);
  }
};

/* ---------------------------------------------------------------------
   L5 · M2 — FEED THE MULTITUDE (right hand, SPEED → people fed)

const FeedMultitude = {

/* ---------------------------------------------------------------------
   L5 · M3 — TWELVE BASKETS (both hands, SPEED + ACCURACY)

   --------------------------------------------------------------------- */
const TwelveBaskets = {
  id: 'L5M3', title: 'Twelve Baskets', duration: 45,

    Object.assign(S, { hunger: this.CFG.START, shown: this.CFG.START, peak: this.CFG.START, baskets: 0, phase: 'play', endT: 0, sat: 0 });
    S.th = [...Array(40).keys()].map(() => rand(0.38, 0.98));
  },
  onKey(S, ok) {

    if (ok) S.hunger = Math.max(0, S.hunger - this.CFG.CALM);
    else { S.hunger += this.CFG.MISS; Sound.twang(); burst(S.particles, E.sw * 0.22, E.g - E.sh * 0.2, 5, 'dust', E.sh * 0.3, E.sh * 0.012); }
    const it = feedKey(S, ok); if (!it) return;
    if (!it.miss && S.baskets < 12) { S.baskets++; Sound.blip(NOTES[S.baskets % 10]); floatText(S.floats, this.bx(S.baskets - 1), this.by(S.baskets - 1) - E.sh * 0.1, '+1', Math.max(13, E.sh * 0.05)); }
  },
  bx(i) { return E.sw * 0.04 + (i % 6) * E.sw * 0.042; },
  by(i) { return E.g - Math.floor(i / 6) * E.sh * 0.1; },
  onTimeUp(S) { S.phase = 'win'; S.endT = 0; },
  update(S, dt) {

      S.hunger += this.CFG.RISE * dt; S.peak = Math.max(S.peak, S.hunger);

    S.shown += (S.hunger - S.shown) * Math.min(1, dt * 3);

      lines: [`<hi>${S.baskets} of 12 baskets gathered</hi>`, `The crowd stayed ${Math.round((1 - S.peak) * 100)}% content at its hungriest`], score: S.baskets * 100 + Math.round((1 - S.peak) * 99), bestLabel: `${S.baskets}/12 baskets` }));

  },

/* =====================================================================
   LESSON 6 — SCRIPTURE PASSAGES (The Red Sea · Exodus 14–15)
   ===================================================================== */
const EXODUS_VERSES = [
  { t: 'The LORD shall fight for you, and ye shall hold your peace.', ref: 'Exodus 14:14' },
  { t: 'Fear ye not, stand still, and see the salvation of the LORD.', ref: 'Exodus 14:13' },
  { t: 'And Moses stretched out his hand over the sea;', ref: 'Exodus 14:21' },
  { t: 'And the children of Israel went into the midst of the sea upon the dry ground:', ref: 'Exodus 14:22' },
  { t: 'and the waters were a wall unto them on their right hand, and on their left.', ref: 'Exodus 14:22' },
  { t: 'The LORD is my strength and song, and he is become my salvation:', ref: 'Exodus 15:2' }
];
const shuffled = a => [...a].sort(() => Math.random() - 0.5);
// sea between x0..x1. part 0 = closed sea, 1 = fully parted (tall wall behind a dry path)
function redSea(x0, x1, part, closeBack = 0) {
  const g = E.g, seaY = g - E.sh * 0.2, wallY = g - E.sh * lerp(0.2, 0.78, part);
  const wav = (x, y, a) => y + Math.sin(x * 0.03 + E.clock * 2.2) * a + Math.sin(x * 0.013 - E.clock) * a;
  // back wall
  ctx.beginPath(); ctx.moveTo(x0, g);
  ctx.quadraticCurveTo(x0 - E.sw * 0.02 * part, lerp(g, wallY, 0.6), x0 + E.sw * 0.03 * part, wallY);
  for (let x = x0 + E.sw * 0.03 * part; x <= x1 - E.sw * 0.03 * part; x += 8) ctx.lineTo(x, wav(x, wallY, 3 + part * 3));
  ctx.quadraticCurveTo(x1 + E.sw * 0.02 * part, lerp(g, wallY, 0.6), x1, g); ctx.closePath();
  ctx.fillStyle = `rgba(111,168,255,${0.12 + part * 0.1})`; ctx.fill(); pen(2, 0.6, '190,215,255'); ctx.stroke();
  if (part > 0.3) { pen(1.5, 0.25 * part, '190,215,255'); for (let i = 1; i < 5; i++) { ctx.beginPath(); for (let x = x0 + 20; x <= x1 - 20; x += 10) { const y = wav(x + i * 40, lerp(wallY, g, i / 5), 2); x === x0 + 20 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); } ctx.stroke(); } }
  // water still covering the path (closed sea) / returning water
  const cover = Math.max(1 - part, closeBack);
  if (cover > 0.01) water(lerp(g, seaY - E.sh * 0.15 * closeBack, cover), x0, x1, 0.25 * cover + 0.1, 4);
}
function staffMoses(x, g, h, raise, face = 1) {
  const P = person(x, g, h, { face, handF: [lerp(0.5, 0.35, raise), lerp(0.1, -1.0, raise)], handB: [0.2, 0.8] });
  const a = lerp(-1.3, -1.75, raise) * (face > 0 ? 1 : -1) + (face > 0 ? 0 : -Math.PI);
  pen(P.lw * 0.8); poly([[P.hf[0] - Math.cos(a) * h * 0.25, P.hf[1] - Math.sin(a) * h * 0.25], [P.hf[0] + Math.cos(a) * h * 0.45, P.hf[1] + Math.sin(a) * h * 0.45]]);
  pen(P.lw * 0.6, 0.8); poly([[P.head[0] + face * P.r * 0.3, P.head[1] + P.r * 0.8], [P.head[0] + face * P.r * 0.1, P.head[1] + P.r * 1.6], [P.head[0] - face * P.r * 0.3, P.head[1] + P.r * 0.8]]);
  if (raise > 0.8) { const t = [P.hf[0] + Math.cos(a) * h * 0.45, P.hf[1] + Math.sin(a) * h * 0.45]; pen(1, 0.25 * (raise - 0.8) * 5); circle(t[0], t[1], h * 0.08, true); }
  return P;
}
function rock(x0, x1, h) { ctx.beginPath(); ctx.moveTo(x0, E.g); ctx.quadraticCurveTo(x0 + (x1 - x0) * 0.1, E.g - h, (x0 + x1) / 2, E.g - h); ctx.quadraticCurveTo(x1 - (x1 - x0) * 0.1, E.g - h, x1, E.g); ctx.fillStyle = '#2b2f36'; ctx.fill(); pen(2.5, 0.8); ctx.stroke(); }
function chariot(x, g, s, wheel, alpha = 1) {
  ctx.save(); ctx.globalAlpha = alpha;
  animal(x + s * 0.55, g, s * 0.75, 6, 1, wheel * 2);
  pen(Math.max(2, s * 0.03)); poly([[x + s * 0.2, g - s * 0.28], [x + s * 0.32, g - s * 0.3]]);
  ctx.fillStyle = '#2b2f36'; ctx.fillRect(x - s * 0.18, g - s * 0.42, s * 0.38, s * 0.22); ctx.strokeRect(x - s * 0.18, g - s * 0.42, s * 0.38, s * 0.22);
  circle(x, g - s * 0.17, s * 0.17, false);
  for (let i = 0; i < 3; i++) { const a = wheel + i * Math.PI / 3; poly([[x - Math.cos(a) * s * 0.17, g - s * 0.17 - Math.sin(a) * s * 0.17], [x + Math.cos(a) * s * 0.17, g - s * 0.17 + Math.sin(a) * s * 0.17]]); }
  person(x - s * 0.02, g - s * 0.42, s * 0.42, { handF: [0.9, 0.1] });
  ctx.restore();
}
function cloudPillar(x, a) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  for (let i = 0; i < 7; i++) { const y = E.g - E.sh * (0.1 + i * 0.12), r = E.sh * (0.07 + Math.sin(E.clock * 2 + i) * 0.01); ctx.fillStyle = 'rgba(255,255,255,0.2)'; circle(x + Math.sin(E.clock * 1.5 + i) * 8, y, r, true); pen(2, 0.8); circle(x + Math.sin(E.clock * 1.5 + i) * 8, y, r, false); }
  ctx.restore();
}

/* ---------------------------------------------------------------------
   L6 · M1 — RAISE THE STAFF (ACCURACY → faith)
   --------------------------------------------------------------------- */
const RaiseStaff = {
  id: 'L6M1', title: 'Raise the Staff', duration: 150, caseSensitive: true, PCT: 80,
  hint: 'Type the verse exactly — capitals, commas and all',
  pick(S) { return feedPick(S); },
  init(S) {
    const vs = shuffled(EXODUS_VERSES).slice(0, 2);
    S.total = vs.reduce((n, v) => n + v.t.split(' ').length, 0);
    feedInit(S, verseFeed(vs)); Object.assign(S, { faith: 0, shown: 0, phase: 'play', endT: 0, part: 0 });
  },
  onKey(S, ok) {
    if (S.phase !== 'play') return;
    const it = feedKey(S, ok); if (!it) return;
    if (!it.miss) { S.faith = Math.min(1, S.faith + 1.25 / S.total); Sound.blip(NOTES[Math.min(9, Math.floor(S.faith * 10))]); }
    else { S.faith = Math.max(0, S.faith - 0.6 / S.total); Sound.twang(); floatText(S.floats, E.sw * 0.2, E.g - E.sh * 0.7, `“${it.t}”`, Math.max(12, E.sh * 0.045)); }
    if (S.feed.done >= S.total) { S.phase = 'end'; S.endT = 0; E.end(); }
  },
  onTimeUp(S) { S.phase = 'end'; S.endT = 0; },
  update(S, dt) {
    S.line = S.phase === 'play' ? feedLine(S) : null;
    S.shown += (S.faith - S.shown) * Math.min(1, dt * 4);
    const pct = Math.round(100 * S.feed.perfect / Math.max(1, S.feed.done)), win = S.phase === 'end' && S.feed.done >= S.total && pct >= this.PCT;
    S.part = win ? Math.min(1, S.part + dt * 0.6) : S.shown * 0.35;
    if (S.phase === 'end') endAfter(S, dt, win ? 3 : 1.6, () => ({ win, title: win ? 'The Sea Divides!' : 'Try Again',
      verse: win ? '“…and the LORD caused the sea to go back by a strong east wind…” — Exodus 14:21' : '“Fear ye not, stand still, and see the salvation of the LORD…” — Exodus 14:13',
      lines: [`<hi>${pct}% of words typed perfectly</hi>  ·  Goal: ${this.PCT}%`, `Words: ${S.feed.done} of ${S.total}`], score: pct, bestLabel: `${pct}% perfect` }));
  },
  render(S) {
    redSea(E.sw * 0.34, E.sw * 0.99, S.part);
    if (S.shown > 0.2) { pen(1.5, 0.25 * S.shown); for (let i = 0; i < 6; i++) { const y = E.sh * (0.15 + i * 0.07), x = ((E.clock * 220 + i * 170) % (E.sw * 0.8)) + E.sw * 0.2; poly([[x, y], [x + E.sw * 0.06, y]]); } }
    rock(E.sw * 0.04, E.sw * 0.32, E.sh * 0.1);
    staffMoses(E.sw * 0.18, E.g - E.sh * 0.1, E.sh * 0.42, S.shown);
    for (let i = 0; i < 4; i++) person(E.sw * (0.02 + i * 0.025), E.g, E.sh * 0.26, { alpha: 0.5 });
    drawParticles(S.particles); drawFloats(S.floats);
  }
};

/* ---------------------------------------------------------------------
   L6 · M2 — CROSS ON DRY GROUND (SPEED → people across)
   --------------------------------------------------------------------- */
const CrossSea = {
  id: 'L6M2', title: 'Cross on Dry Ground', duration: 50, caseSensitive: true, NEED: 80, N: 16,
  hint: 'Type steadily · every correct key moves Israel forward',
  pick(S) { return feedPick(S); },
  init(S) { feedInit(S, verseFeed(shuffled(EXODUS_VERSES))); Object.assign(S, { prog: 0, shown: 0, phase: 'play', endT: 0, spare: 0 }); },
  onKey(S, ok) {
    if (S.phase !== 'play') return;
    feedKey(S, ok);
    if (!ok) return;
    S.prog++;
    if (S.prog >= this.NEED) { S.phase = 'win'; S.endT = 0; S.spare = Math.max(0, Math.round(this.duration - E.elapsed)); E.end(); }
  },
  onTimeUp(S) { S.phase = 'lose'; S.endT = 0; },
  pos(S, j) { return E.sw * (lerp(-0.62, 0.86, clamp(S.shown / this.NEED)) + j * 0.038); },
  crossed(S) { let c = 0; for (let j = 0; j < this.N; j++) if (this.pos(S, j) > E.sw * 0.82) c++; return c; },
  update(S, dt) {
    S.line = S.phase === 'play' ? feedLine(S) : null;
    S.shown += (S.prog - S.shown) * Math.min(1, dt * 5);
    if (S.phase === 'win') endAfter(S, dt, 2.2, () => ({ win: true, title: 'Safely Across!', verse: '“But the children of Israel walked upon dry land in the midst of the sea…” — Exodus 14:29',
      lines: [`<hi>All crossed with ${S.spare}s to spare</hi>`], score: S.spare, bestLabel: `${S.spare}s to spare` }));
    if (S.phase === 'lose') endAfter(S, dt, 1.6, () => ({ win: false, title: 'Try Again', verse: '“…speak unto the children of Israel, that they go forward.” — Exodus 14:15',
      lines: [`${this.crossed(S)} of ${this.N} reached the far shore`] }));
  },
  render(S) {
    redSea(E.sw * 0.18, E.sw * 0.8, 1);
    rock(E.sw * 0.84, E.sw * 1.02, E.sh * 0.08);
    staffMoses(E.sw * 0.93, E.g - E.sh * 0.08, E.sh * 0.38, 1, -1);
    let k = 0;
    for (let j = this.N - 1; j >= 0; j--) {
      let x = this.pos(S, j), across = x > E.sw * 0.82;
      if (across) { x = E.sw * (0.83 + (k % 4) * 0.025); k++; }
      if (x < -20) continue;
      person(x, E.g - (across ? E.sh * 0.02 : 0), E.sh * (0.24 + (j % 3) * 0.03), { walk: across ? null : S.shown * 1.3 + j, alpha: across ? 0.6 : 1, handF: across && S.phase === 'win' ? [0.3, -0.95] : null });
    }
    text(`${this.crossed(S)} / ${this.N} across`, E.sw * 0.5, E.sh * 0.08, Math.max(13, E.sh * 0.05), 0.75, 700);
    drawParticles(S.particles); drawFloats(S.floats);
  }
};

/* ---------------------------------------------------------------------
   L6 · M3 — HOLD BACK THE SEA (SPEED + ACCURACY)
   Speed = Israel crosses. Accuracy = each clean word raises the pillar of
   cloud between Israel and the chariots (Exodus 14:19-20).
   --------------------------------------------------------------------- */
const HoldSea = {
  id: 'L6M3', title: 'Hold Back the Sea', duration: 600, caseSensitive: true, NEED: 80, START: -0.35, TRAVEL: 47, FIELD: 40, N: 10,
  hint: 'Type to cross · clean words raise the pillar of cloud',
  pick(S) { return feedPick(S); },
  init(S) { feedInit(S, verseFeed(shuffled(EXODUS_VERSES))); Object.assign(S, { p: 0, shown: 0, c: this.START, stunUntil: -1, stunMax: 1, tally: [0, 0, 0, 0, 0], phase: 'play', endT: 0, spare: 0, back: 0, wheel: 0 }); },
  x(v) { return E.sw * lerp(0.1, 0.86, v); },
  onKey(S, ok) {
    if (S.phase !== 'play') return;
    if (ok) { S.p = Math.min(1, S.p + 1 / this.NEED); }
    const it = feedKey(S, ok);
    if (it) {
      const q = Math.min(it.miss, 4), st = ZONE_STUN[q]; S.tally[q]++;
      if (st > 0) { S.stunUntil = Math.max(S.stunUntil, E.clock + st); S.stunMax = st; Sound.horn(220, 0.4); }
      floatText(S.floats, this.x(S.c) + E.sw * 0.07, E.g - E.sh * 0.75, ['Pillar of cloud!', 'Cloud', 'Mist', 'Haze', 'Missed'][q], Math.max(13, E.sh * 0.05));
    }
    if (S.p >= 1) { S.phase = 'win'; S.endT = 0; S.spare = Math.max(0, Math.round((S.p - S.c) * this.FIELD)); E.end(); Sound.splash(); }
  },
  onTimeUp(S) { S.phase = 'lose'; S.endT = 0; },
  update(S, dt) {
    S.line = S.phase === 'play' ? feedLine(S) : null;
    S.shown += (S.p - S.shown) * Math.min(1, dt * 5);
    if (S.phase === 'play' && E.state === 'playing' && E.clock >= S.stunUntil) {
      S.c += (1 - this.START) / this.TRAVEL * dt; S.wheel += dt * 8;
      if (S.c >= S.shown - 0.01) { S.phase = 'lose'; S.endT = 0; E.end(); }
    }
    const t = S.tally, tally = `Pillar ${t[0]} · Cloud ${t[1]} · Mist ${t[2]} · Haze ${t[3]} · Missed ${t[4]}`;
    if (S.phase === 'win') {
      S.back = Math.min(1, S.back + dt * 0.7); S.c += dt * 0.08; S.wheel += dt * 4;
      endAfter(S, dt, 3, () => ({ win: true, title: 'Victory!', verse: '“The LORD is my strength and song, and he is become my salvation…” — Exodus 15:2',
        lines: [`<hi>Israel crossed with the chariots ${S.spare} cubits behind</hi>`, tally], score: S.spare, bestLabel: `${S.spare} cubits ahead` }));
    }
    if (S.phase === 'lose') endAfter(S, dt, 1.8, () => ({ win: false, title: 'Try Again', verse: '“The LORD shall fight for you, and ye shall hold your peace.” — Exodus 14:14',
      lines: [`The chariots caught up ${Math.round(S.shown * 100)}% of the way across`, tally, 'Tip: clean words raise the cloud and hold the chariots longest.'] }));
  },
  render(S) {
    redSea(E.sw * 0.22, E.sw * 0.82, 1, S.back);
    fieldMarks(this.x(1), this.x(0), this.FIELD, 0);
    rock(E.sw * 0.84, E.sw * 1.02, E.sh * 0.08);
    staffMoses(E.sw * 0.93, E.g - E.sh * 0.08, E.sh * 0.38, 1, -1);
    for (let j = this.N - 1; j >= 0; j--) {
      const x = Math.min(this.x(S.shown) + j * E.sw * 0.03, E.sw * (0.8 + (j % 3) * 0.02));
      person(x, E.g, E.sh * (0.22 + (j % 3) * 0.03), { walk: S.phase === 'lose' ? null : S.shown * 60 + j, handF: S.phase === 'win' && x > E.sw * 0.78 ? [0.3, -0.95] : null });
    }
    const cx = this.x(S.c);
    if (cx > -E.sw * 0.2) chariot(cx, E.g, E.sh * 0.42, S.wheel, S.phase === 'win' ? 1 - S.back * 0.8 : 1);
    const stun = clamp((S.stunUntil - E.clock) / Math.max(0.25, S.stunMax));
    cloudPillar(Math.min(cx + E.sw * 0.09, this.x(S.shown) - E.sw * 0.03), stun);
    if (S.phase === 'win') water(E.g - E.sh * 0.25 * S.back, E.sw * 0.22, E.sw * 0.82, 0.3 * S.back, 5);
    drawParticles(S.particles); drawFloats(S.floats);
  }
};

    lines.push(`Accuracy: ${Math.round(E.accuracy() * 100)}%  ·  Speed: ${E.wpm()} WPM`);
    $('ov-stats').innerHTML = lines.map(l => l.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])).replace(/&lt;hi&gt;(.*?)&lt;\/hi&gt;/g, '<span class="hi">$1</span>')).join('<br>');
    const idx = ORDER.indexOf(E.mod.id), next = ORDER[idx + 1];
    const showNext = res.win && next && GAMES[next];
    $('ov-next').hidden = !showNext;
    $('ov-next').classList.toggle('primary', !!showNext);
    $('ov-retry').classList.toggle('primary', !showNext);
    $('overlay').classList.add('show');
  },
  primary() { if (!$('ov-next').hidden) this.next(); else this.retry(); },
  retry() { E.start(E.mod); },
  next() { const n = ORDER[ORDER.indexOf(E.mod.id) + 1]; if (n && GAMES[n]) E.start(GAMES[n]); }
};
$('ov-retry').addEventListener('click', () => UI.retry());
$('ov-next').addEventListener('click', () => UI.next());
$('ov-menu').addEventListener('click', () => UI.showMenu());
$('btn-back').addEventListener('click', () => UI.showMenu());
function syncSound() { ['btn-sound', 'btn-sound-menu'].forEach(id => $(id).textContent = `Sound: ${Sound.on ? 'On' : 'Off'}`); }
['btn-sound', 'btn-sound-menu'].forEach(id => $(id).addEventListener('click', e => { Sound.set(!Sound.on); syncSound(); e.currentTarget.blur(); }));
syncSound();

function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1800); }

function renderNav() {
  const nav = $('lessons'); nav.innerHTML = '';
  LESSONS.forEach((L, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'lesson-btn' + (L.modules.length ? '' : ' locked');
    b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', i === UI.selected);
    const done = L.modules.filter(m => Progress.get(m.id).done).length;
    b.innerHTML = `<span>${L.title} · ${L.subtitle}</span><small>${L.modules.length ? `${done} / ${L.modules.length} complete` : 'Coming soon'}</small>`;
    b.addEventListener('click', () => { UI.selected = i; renderNav(); renderDetail(); });
    nav.appendChild(b);
  });
}
function renderDetail() {
  const L = LESSONS[UI.selected], det = $('detail');
  const keys = L.keys.map(k => `<span class="key">${k}</span>`).join('');
  const mods = L.modules.length ? `<div class="modules">${L.modules.map((m, i) => {
    const g = GAMES[m.id], p = Progress.get(m.id);
    const status = p.done ? `✓ Completed${p.bestLabel ? ' · Best: ' + p.bestLabel : ''}` : (p.bestLabel ? `Best: ${p.bestLabel} · ▶ Play` : (g ? '▶ Play' : 'In development'));
    return `<button type="button" class="module" data-id="${m.id}" ${g ? '' : 'disabled'}>
      <span class="tag">Module ${i + 1} · ${m.kind}</span><h3>${g ? g.title : m.id}</h3><p>${m.desc}</p>
      <p><strong>Keys:</strong> ${m.keys}</p><span class="status ${p.done ? 'done' : ''}">${status}</span></button>`;
  }).join('')}</div>` : `<p class="story">This lesson is being written.</p>`;
  det.innerHTML = `<h2>${L.title}: ${L.subtitle}</h2><p class="story">${L.story}</p><div class="keys">${keys}</div>${mods}`;
  det.querySelectorAll('.module:not(:disabled)').forEach(b => b.addEventListener('click', () => E.start(GAMES[b.dataset.id])));
}
$('lessons').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowRight') UI.selected = Math.min(LESSONS.length - 1, UI.selected + 1);
  else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') UI.selected = Math.max(0, UI.selected - 1);
  else return;
  e.preventDefault(); renderNav(); renderDetail(); $('lessons').children[UI.selected].focus();
});
$('btn-progress').addEventListener('click', () => toast(`${ORDER.filter(id => Progress.get(id).done).length} of ${ORDER.length} modules complete`));
$('btn-reset').addEventListener('click', () => { if (confirm('Reset all progress?')) { Progress.reset(); renderNav(); renderDetail(); toast('Progress reset'); } });

/* ---------- menu banner ---------- */
const Banner = {
  cv: $('banner'), c: $('banner').getContext('2d'),
  size() { const dpr = Math.min(devicePixelRatio || 1, 2); this.cv.width = Math.round(this.cv.clientWidth * dpr); this.cv.height = Math.round(this.cv.clientHeight * dpr); this.c.setTransform(dpr, 0, 0, dpr, 0, 0); },
  draw(t) {
    const c = this.c, CW = this.cv.clientWidth, CH = this.cv.clientHeight;
    if (!CW || !CH) return;
    const dpr = Math.min(devicePixelRatio || 1, 2);
    if (this.cv.width !== Math.round(CW * dpr) || this.cv.height !== Math.round(CH * dpr)) this.size();
    // the scene is designed 90px tall; scale it down to fit shorter banners so nothing gets cut off
    const k = Math.min(1, CH / 90), W = CW / k, H = CH / k, g = H - 8;
    c.setTransform(dpr * k, 0, 0, dpr * k, 0, 0);
    c.clearRect(0, 0, W, H);
    c.strokeStyle = c.fillStyle = 'rgba(255,255,255,0.9)'; c.lineCap = c.lineJoin = 'round';
    const line = pts => { c.beginPath(); c.moveTo(...pts[0]); pts.slice(1).forEach(p => c.lineTo(...p)); c.stroke(); };
    const head = (x, y, r) => { c.beginPath(); c.arc(x, y, r, 0, TAU); c.stroke(); };
    const fig = (x, h, step = 0) => { const hip = [x, g - h * 0.45], sh = [x, hip[1] - h * 0.3], r = h * 0.1; line([[x - h * 0.1 + step, g], hip, [x + h * 0.1 - step, g]]); line([hip, sh]); head(x, sh[1] - r * 1.3, r); return { sh, r, hy: sh[1] - r * 1.3 }; };
    c.lineWidth = 1; c.globalAlpha = 0.25; line([[0, g], [W, g]]); c.globalAlpha = 1;
    c.lineWidth = 2.5;
    const dx = W * 0.22, D = fig(dx, 46), hand = [D.sh[0] + 4, D.sh[1] - 16];
    line([D.sh, hand]); line([D.sh, [D.sh[0] - 8, D.sh[1] + 12]]);
    const a = t / 140, pouch = [hand[0] + Math.cos(a) * 13, hand[1] + Math.sin(a) * 6.5];
    c.lineWidth = 1.2; line([hand, pouch]); c.beginPath(); c.arc(...pouch, 2.5, 0, 7); c.fill();
    c.lineWidth = 3.5;
    const gx = W * 0.4 + Math.sin(t / 1400) * 20, G = fig(gx, 80, Math.sin(t / 220) * 7);
    line([G.sh, [G.sh[0] - 14, G.sh[1] + 22]]); line([G.sh, [G.sh[0] + 12, G.sh[1] + 18]]);
    c.lineWidth = 2; line([[G.sh[0] + 18, G.sh[1] + 36], [G.sh[0] + 6, G.sh[1] - 40]]);
    c.beginPath(); c.arc(gx, G.hy, G.r * 1.15, Math.PI, 0); c.stroke();
    c.lineWidth = 2.5;
    const tx = W * 0.78; line([[tx + 18, g], [tx + 18, g - 50]]); line([[tx - 6, g - 22], [tx + 18, g - 22]]); line([[tx - 6, g - 22], [tx - 6, g]]);
    const sy = g - 22, sx = tx + 10;
    line([[sx, sy], [sx, sy - 24]]); line([[sx, sy], [sx - 16, sy], [sx - 16, g]]); head(sx, sy - 31, 6);
    line([[sx - 4, sy - 40], [sx, sy - 44], [sx + 4, sy - 40]]); line([[sx, sy - 18], [sx - 10, sy - 10 + Math.sin(t / 600) * 2]]);
    const hx = W * 0.64, H2 = fig(hx, 40);
    c.lineWidth = 1.5; c.beginPath(); c.moveTo(hx + 8, H2.sh[1] + 16); c.quadraticCurveTo(hx + 22, H2.sh[1], hx + 12, H2.sh[1] - 8); c.stroke();
    line([[hx + 8, H2.sh[1] + 16], [hx + 12, H2.sh[1] - 8]]);
    c.lineWidth = 2.5; line([H2.sh, [hx + 12, H2.sh[1] + 6]]);
    c.font = '14px serif';
    for (let i = 0; i < 3; i++) { const p = ((t / 2400) + i / 3) % 1; c.globalAlpha = 1 - p; c.fillText('♪', hx + 20 + p * 40, H2.sh[1] - p * 40); }
    c.globalAlpha = 1;
  }
};

if (/[?&]embed\b/.test(location.search)) document.body.classList.add('embed');
UI.showMenu();
requestAnimationFrame(frame);

})();
